services:
  postgres:
    image: postgres:16
    container_name: lifesim-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-lifesim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lifesim_example_password}
      POSTGRES_DB: ${DB_NAME:-lifesim}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lifesim} -d ${DB_NAME:-lifesim}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: lifesim-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-lifesim}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-lifesim}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-lifesim_example_password}
      - JWT_SECRET=${JWT_SECRET:-VGhpc0lzQVZlcnlTZWN1cmVLZXlUaGF0SXNMb25nRW5vdWdoVG9CeXBhc3NUaGVXZWFrS2V5RXhjZXB0aW9u}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: lifesim-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
